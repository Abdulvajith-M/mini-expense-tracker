<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select, textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
        }

        .message {
            background: #fee2e2;
            padding: 10px;
            margin-bottom: 10px;
        }

        a {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Edit Expense</h1>

        {% for message in get_flashed_messages() %}
            <div class="message">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            <label>Expense Title</label>
            <input type="text" name="title"
                   maxlength="100" required
                   value="{{ expense.title }}">

            <label>Amount (₹)</label>
            <input type="number" name="amount"
                   min="0.01" step="0.01" required
                   value="{{ expense.amount }}">

            <label>Category</label>
            <select name="category" required>
                {% for category in categories %}
                    <option value="{{ category }}"
                        {% if expense.category == category %}selected{% endif %}>
                        {{ category }}
                    </option>
                {% endfor %}
            </select>

            <label>Expense Date</label>
            <input type="date" name="expense_date"
                   max="{{ today }}" required
                   value="{{ expense.expense_date.isoformat() }}">

            <label>Notes (Optional)</label>
            <textarea name="notes" maxlength="250">{{ expense.notes or '' }}</textarea>

            <button type="submit">Save Changes</button>
        </form>

        <a href="{{ url_for('home') }}">Back to Expenses</a>
    </div>
</body>
</html>
